services:
  db:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: seculas7_e0c
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
      - ../seculas7_e0c.sql:/docker-entrypoint-initdb.d/01-seculas7_e0c.sql:ro
      - ./db-init/02-fix-urls.sql:/docker-entrypoint-initdb.d/02-fix-urls.sql:ro
  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      - db
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: seculas7_e0c
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_TABLE_PREFIX: e0c_
    volumes:
      - wp_data:/var/www/html
      - ../wp-content/plugins:/var/www/html/wp-content/plugins
      - ../wp-content/themes:/var/www/html/wp-content/themes
      - ../wp-content/uploads:/var/www/html/wp-content/uploads
      - ../wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
volumes:
  db_data:
  wp_data:
